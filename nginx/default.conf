# HTTP server
server {
    listen 80;
    server_name _;
    
    # API proxy configuration
    location / {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;

        # Proxy settings
        proxy_pass http://chatbot-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";  # Mudança crítica para Gemini
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts aumentados para Gemini (latência Brasil-EUA + processamento)
        proxy_connect_timeout 30s;      # Era 5s - CRÍTICO!
        proxy_send_timeout 120s;        # Era 60s
        proxy_read_timeout 120s;        # Era 60s
        proxy_next_upstream_timeout 120s;

        # Buffer desabilitado para streaming (recomendado para Gemini)
        proxy_buffering off;
        proxy_request_buffering off;

        # Keep-alive
        keepalive_timeout 120s;
        keepalive_requests 100;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://chatbot-api:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log off;
    }
}

